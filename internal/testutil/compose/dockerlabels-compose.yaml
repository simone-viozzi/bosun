# dockerlabels-compose.yaml
#
# Purpose: Basic Docker entities with bosun.* config labels (not job labels).
# Used by: integration/dockerlabels_test.go, Test_Integration_PlanList_NoJobs
#
# This fixture creates containers, volumes, and networks with generic bosun.*
# labels but NO bosun.job.* labels, useful for testing label discovery without
# job semantics.

services:
  test-app:
    image: nginx:alpine
    labels:
      bosun.test: "true"
      bosun.role: "webserver"
    volumes:
      - test-data:/data
    networks:
      - test-net

volumes:
  test-data:
    labels:
      bosun.test: "true"
      bosun.purpose: "storage"

networks:
  test-net:
    labels:
      bosun.test: "true"
      bosun.type: "internal"
