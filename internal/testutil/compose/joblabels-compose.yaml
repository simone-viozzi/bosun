# joblabels-compose.yaml
#
# Purpose: Docker entities with bosun.job.* labels for testing job discovery.
# Used by: integration/joblabels_test.go, integration/plan_test.go
#
# This fixture creates:
#   - Two containers (postgres, redis) with bosun.job.enabled=true and same job name
#     (tests job merging from multiple containers)
#   - One container with bosun.job.enabled=false (tests disabled jobs are ignored)
#   - One container without job labels (tests non-job containers are filtered)
#   - Two volumes attached to the "daily-backup" job
#   - One orphan volume attached to a nonexistent job (tests orphan detection)

services:
  postgres:
    image: nginx:alpine  # Using nginx as placeholder (no actual postgres needed for label tests)
    labels:
      bosun.job.enabled: "true"
      bosun.job.name: "daily-backup"
      bosun.job.schedule: "0 2 * * *"
      bosun.job.worker.image: "backup-worker:test"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: nginx:alpine
    labels:
      bosun.job.enabled: "true"
      bosun.job.name: "daily-backup"  # Same job name - should merge with postgres
    volumes:
      - redis-data:/data
    networks:
      - backend

  disabled-service:
    image: nginx:alpine
    labels:
      bosun.job.enabled: "false"
      bosun.job.name: "should-not-exist"

  no-job-labels:
    image: nginx:alpine
    labels:
      com.example.other: "value"  # Non-bosun label to test filtering

volumes:
  pgdata:
    labels:
      bosun.job.attach: "daily-backup"
      bosun.job.mount.path: "/backup/postgres"
      bosun.job.mount.mode: "ro"

  redis-data:
    labels:
      bosun.job.attach: "daily-backup"
      bosun.job.mount.path: "/backup/redis"
      bosun.job.mount.mode: "ro"

  orphan-volume:
    labels:
      bosun.job.attach: "nonexistent-job"

networks:
  backend:
    labels:
      bosun.network.priority: "100"
