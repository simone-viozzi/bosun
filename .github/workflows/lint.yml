name: Lint

on:
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true
        cache-dependency-path: go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
